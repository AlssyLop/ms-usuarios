spring.application.name=user-services

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/plazoleta_usuarios?useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

# OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# SQL init
spring.sql.init.mode=always

# JWT RSA-4096 (clave privada solo en ms-usuarios, clave pública para compartir)
jwt.private-
jwt.public-
jwt.expiration.admin=3600000
jwt.expiration.propietario=3600000
jwt.expiration.empleado=43200000
jwt.expiration.cliente=43200000
jwt.refresh-threshold=28800000

# ms-restaurantes
ms-restaurantes.url=http://localhost:8082

# Server
server.port=8081